name: Проверка baapp.ru
on: {schedule: [{cron: '*/5 * * * *'}], workflow_dispatch: {}}
permissions: {contents: write}
concurrency: {group: uptime, cancel-in-progress: false}
jobs: {check: {runs-on: ubuntu-latest, timeout-minutes: 4, steps: [{uses: actions/checkout@v4}, {name: Проверка сайта, run: python3 check.py, env: {TG_TOKEN: '${{ secrets.TG_TOKEN }}', TG_CHAT: '${{ secrets.TG_CHAT }}', TEST: '${{ github.event_name == ''workflow_dispatch'' }}'}}]}}
